<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Echo — Платформа для изучения языков с ИИ</title>
  <script>
    try {
      if (localStorage.getItem('echo_theme_v1') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-dot"></span>
        Echo
      </div>
      <div class="controls">
        <select id="levelSelect" title="Уровень"></select>
        <select id="topicSelect" title="Тема"></select>
        <button id="themeBtn" class="icon-btn" title="Тёмная тема"></button>
        <button id="autoPlayBtn" class="icon-btn active" title="Автоозвучка ответов">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <button id="restartBtn" class="icon-btn" title="Обновить текущую вкладку">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
      </div>
    </header>

    <!-- Вкладка 1: Диалог -->
    <section id="chatView" class="view-pane active">
      <main id="chat" class="chat"></main>

      <footer class="chat-footer">
        <div id="voicePanel" class="voice-panel">
          <button id="cancelRecBtn" class="side-btn left" style="display:none;" title="Отменить запись">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>

          <div id="recInfo" class="rec-info">
            <span id="recTimer">0:00</span>
            <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
          </div>

          <button id="micBtn" class="mic-btn" title="Нажмите, чтобы говорить">
            <svg id="micIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>

          <button id="toTextBtn" class="side-btn right" title="Написать текстом">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="8" y1="12" x2="8" y2="12"></line><line x1="12" y1="12" x2="12" y2="12"></line><line x1="16" y1="12" x2="16" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
          </button>
        </div>

        <form id="textPanel" class="text-panel">
          <button type="button" id="toVoiceBtn" class="icon-btn" title="Вернуться к голосу">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
          </button>
          <input id="textInput" class="text-input" type="text" placeholder="Напишите фразу..." autocomplete="off" />
          <button id="sendTextBtn" class="send-btn" type="submit">Отправить</button>
        </form>

        <div id="hintText" class="hint-text">Нажмите на микрофон, чтобы ответить голосом</div>
      </footer>
    </section>

    <!-- Вкладка 2: Чтение -->
    <section id="readingView" class="view-pane">
      <div class="scroll-pane">
        <form id="readingForm" class="action-bar">
          <input id="customTopicInput" class="field-input" type="text" placeholder="Своя тема (или используется тема сверху)..." />
          <button id="genReadingBtn" type="submit" class="primary-btn">Новый текст</button>
        </form>
        <div id="readingContent"></div>
      </div>
    </section>

    <!-- Вкладка 3: Грамматика -->
    <section id="grammarView" class="view-pane">
      <div class="scroll-pane">
        <div>
          <div id="grammarTopicsLabel" class="g-section-label">Темы грамматики</div>
          <div id="grammarTopicsChips" class="g-topic-chips"></div>
        </div>
        <form id="grammarCustomForm" class="action-bar">
          <input id="grammarCustomInput" class="field-input" type="text" placeholder="Или впишите свою тему (напр. разница for и since)..." />
          <button id="grammarStartBtn" type="submit" class="primary-btn">Начать</button>
        </form>
        <div id="grammarContent"></div>
      </div>
    </section>

    <!-- Вкладка 4: Словарь и карточки -->
    <section id="vocabView" class="view-pane">
      <div class="scroll-pane">
        <div class="tabs">
          <button type="button" id="tabNotes" class="tab-btn active">Заметки</button>
          <button type="button" id="tabCards" class="tab-btn">Карточки</button>
        </div>

        <div id="notesView" style="display:flex; flex-direction:column; gap:14px;">
          <form id="manualAddForm" class="add-box">
            <div class="add-row">
              <input id="manualEn" class="field-input" type="text" placeholder="Слово или фраза" required />
              <input id="manualRu" class="field-input" type="text" placeholder="Перевод на русский" required />
            </div>
            <div style="display:flex; gap:8px;">
              <input id="manualNote" class="field-input" style="flex:1;" type="text" placeholder="Заметка или пример (необязательно)" />
              <button type="submit" class="primary-btn" style="padding:0 14px;">Добавить</button>
            </div>
          </form>
          <div id="vocabList" class="vocab-list"></div>
        </div>

        <div id="cardsView" style="display:none; flex-direction:column; gap:14px;"></div>
      </div>
    </section>

    <!-- Нижнее меню приложения -->
    <nav class="bottom-nav" aria-label="Разделы">
      <button type="button" id="navChat" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Диалог</span>
      </button>
      <button type="button" id="navReading" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        <span>Чтение</span>
      </button>
      <button type="button" id="navGrammar" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Грамматика</span>
      </button>
      <button type="button" id="navVocab" class="nav-item">
        <span id="navVocabBadge" class="nav-badge empty">0</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        <span>Словарь</span>
      </button>
    </nav>
  </div>

  <!-- Быстрое сохранение слова/фразы -->
  <div id="saveModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Сохранить в заметки</span>
        <button id="closeSaveModal" class="icon-btn" title="Закрыть">✕</button>
      </div>
      <form id="saveWordForm" class="modal-body">
        <div class="field-group">
          <div class="word-head">
            <label class="field-label" for="swWord">Слово или фраза</label>
            <button type="button" id="swPlayBtn" class="chip-btn">▶ Послушать</button>
          </div>
          <input id="swWord" class="field-input" type="text" required />
        </div>
        <div class="field-group">
          <label class="field-label" for="swTranslation">Перевод (RU)</label>
          <input id="swTranslation" class="field-input" type="text" placeholder="Загрузка перевода..." required />
        </div>
        <div class="field-group">
          <label class="field-label" for="swNote">Заметка или пример (необязательно)</label>
          <input id="swNote" class="field-input" type="text" placeholder="Например, контекст из текста" />
        </div>
        <div style="display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:4px;">
          <button type="button" id="deleteFromQuickBtn" class="secondary-btn" style="display:none; color:var(--danger); border-color:var(--danger-border);">Удалить</button>
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button type="button" id="cancelSaveBtn" class="secondary-btn">Отмена</button>
            <button type="submit" id="confirmSaveBtn" class="primary-btn">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
